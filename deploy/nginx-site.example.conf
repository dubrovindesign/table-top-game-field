# Example nginx server block: HTTPS static + /__mp_ws → roomServer.
# Adjust ssl_certificate paths, root, and server_name.

upstream hex_room_ws {
	server 127.0.0.1:3333;
}

server {
	listen 443 ssl http2;
	server_name game.example.com;

	ssl_certificate     /etc/letsencrypt/live/game.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/game.example.com/privkey.pem;

	root /var/www/hex-board-game/dist;
	index index.html;

	location /__mp_ws {
		proxy_pass http://hex_room_ws;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_read_timeout 86400;
	}

	location /api/scenarios {
		proxy_pass http://hex_room_ws;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}

server {
	listen 80;
	server_name game.example.com;
	return 301 https://$host$request_uri;
}
